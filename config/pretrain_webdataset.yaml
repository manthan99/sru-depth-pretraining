dataloader:
  train_data_root: /media/sharedaccess/Manthan_RSL_SSD/test_webdataset
  val_data_root: /media/sharedaccess/Manthan_RSL_SSD/test_webdataset
  dataset_list:
  shard_pattern: "*.tar"
  images_per_shard: 3200
  shuffle_buffer: 1000
  resampled: true
  new_image_shape_hw: [640, 640]
  crop_min: 320
  resize_shape_hw: [64, 64]
  batch_size: 256
  num_workers: 8
  pin_memory: true
  use_augmentation: true
  min_depth: 0.25
  max_depth: 10.0
  max_depth_ch0: 100.0
  max_depth_ch1: 10.0
  focal_length: 28.0
  baseline: 0.12
  input_mean: [0.3347, 0.5781, 0.4711]
  input_std: [0.2514, 0.3264, 0.3328]

training:
  log_space: false
  init_beta: 0.1
  final_beta: 0.5
  loss_scale: 10.0
  noise_type: parametric
  noise_prob: 0.9
  epochs: 100
  max_steps: -1
  learning_rate: 0.001
  weight_decay: 0.0001
  eta_min: 0.000001
  gradient_clip_val: 1.0
  num_gpus: 1
  precision: 16-mixed
  output_path: output
  save_top_k: 3
  limit_train_batches: 1000
  limit_val_batches: 50
  log_every_n_steps: 50
  is_wandb: false
  wandb_project: reconstruction-vae
  wandb_entity:
  run_name: regnet-webdataset-pretrain

model:
  model_type: vae
  latent_dim: 64
  in_channels: 3
  out_channels: 3
